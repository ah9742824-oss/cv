 العتاد إلى البرمجيات",schematicFootRight:"اضغط على أي مرحلة",stages:{circuit:{name:"الدائرة",note:"قدرة ومرحّلات وحساسات — الطبقة المادية."},logic:{name:"المنطق",note:"قواعد التحكم التي تحدّد ما يحدث ومتى."},code:{name:"الكود",note:"برمجيات مدمجة وخدمات تنفّذ هذا المنطق."},app:{name:"التطبيق",note:"الواجهة التي يتعامل معها المستخدم فعلياً."}}},about:{label:"نبذة",title:"طالب هندسة لم يتوقف عن البناء",p1:"بدأت البرمجة كهواية في الصف الثالث الإعدادي، بدافع الفضول أكثر من أي خطة: أردت أن أعرف كيف تُصنع الأشياء التي أراها على الشاشة.",p2:"وكلما تعمّقت اتضح لي حجم المجال واتساعه. تعلّمت من إدراك ويوتيوب ومن كثير من التجربة والخطأ، وانتقلت بين أكثر من مجال حتى فهمت كيف تتصل هذه المجالات ببعضها.",p3:"اليوم أدرس هندسة القوى الكهربائية وأطوّر مهاراتي البرمجية في الوقت نفسه. أتعلّم أفضل عندما أبني شيئاً يعمل فعلاً، لا عندما أقرأ عنه فقط.",p4:"لهذا جاء معظم ما أعرفه من المشاريع: تطبيق ويب بقاعدة بيانات حقيقية، ونظام إنترنت أشياء يتحكم في إضاءة غرفة فعلية، ودوائر تحكم نفّذتها على منصة تدريب.",exploredTitle:"مجالات جرّبتها"},engineering:{label:"الهندسة",title:"الهندسة",sub:"قوى كهربائية · تحكم · أتمتة",lede:"دراستي في هندسة القوى الكهربائية، مع عمل تطبيقي على دوائر التحكم والأنظمة الكهربائية خلال التدريب.",pipelineTitle:"من الطاقة إلى الواجهة",pipeline:{system:{name:"النظام الكهربائي",note:"تغذية وحماية ومحركات وأحمال."},control:{name:"منطق التحكم",note:"كونتاكتورات وتوقيت وتشغيل أمامي وعكسي."},controller:{name:"متحكم مدمج",note:"متحكم دقيق يتولّى اتخاذ القرار."},interface:{name:"واجهة برمجية",note:"تطبيق يجعل التحكم في النظام ممكناً عن بُعد."}}},bridge:{label:"هندسة × برمجة",quote:"التقاء الهندسة بالبرمجة هو المكان الذي تبدأ منه أكثر مشاريعي إثارة للاهتمام.",caseTitle:"SmartLight",p1:"SmartLight نظام إنترنت أشياء مبني على متحكم ESP32 مبرمَج بلغة C++، مع تطبيق موبايل بـ Flutter.",p2:"يتصل الـ ESP32 بالإنترنت ويشغّل ثمانية مرحّلات تمثّل إضاءة الغرفة، والتطبيق يرسل الأوامر، فيصبح التحكم في النظام ممكناً من أي مكان.",relayTitle:"لوحة المرحّلات",relayHint:"ثماني قنوات — جرّب تشغيله
